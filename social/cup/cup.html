<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blessed cup 3D</title>
<!-- The site's cup (src/scripts/cup.js studioScene: model, studio light, contact shadow, steam), posed for
     social renders. Served from the repo root (serve.mjs), so three.js is the site's own copy.
     window.pose(o) poses a still or a reel frame, window.frame(t) one turn of the spin loop (t 0..1),
     window.glb() returns the model as a base64 GLB. Open directly for a live preview (?live). -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1410; }
  #bg { position: fixed; inset: -40px; background: url(boxes-backdrop.jpg) center / cover;
        filter: blur(14px) brightness(.55) saturate(.9); }
  canvas { position: fixed; inset: 0; }
  html.clean, body.clean { background: transparent; }
  body.clean #bg { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js",
               "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div id="bg"></div>
<script type="module">
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { studioScene } from '/src/scripts/cup.js';

const q = new URLSearchParams(location.search);
if (q.has('clean')) { document.body.classList.add('clean'); document.documentElement.classList.add('clean'); }

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); // 1 for render.mjs, 2 for the supersampled stills
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;
document.body.appendChild(renderer.domElement);

const { scene, key, rim, tilt, cup, floor, steam, vent } = await studioScene(renderer, '/src/assets/cup-label.jpg');
cup.children[0].material.map.userData.mimeType = 'image/jpeg';
steam.material.uniforms.uTop.value = renderer.domElement.height;
const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 20, 3000);

// Posed stills and reels (social/cup/shots.mjs, social/render-reels.mjs). Every field is optional;
// anything left out falls back to the site's 'front' framing and studio light. rot is in turns:
// 0 = logo panel, 0.37 = slogan panel, 0.69 = Mrs Rose + Goppion panel. Seams sit near 0.185, 0.53
// and 0.85: never hold a close-up there. shadow scales the contact shadow, steam is the steam's
// clock in seconds (left out: no steam).
const D = { keyPos: key.position.toArray(), keyI: key.intensity, keyAngle: key.angle, rimI: rim.intensity, env: scene.environmentIntensity };
const v3 = new THREE.Vector3();
window.pose = ({ rot = 0, tilt: z = 0, lean = 0, lift = 0, cam = [0, 150, 560], look = [0, 72, 0], fov = 24,
                 keyPos = D.keyPos, keyI = D.keyI, keyAngle = D.keyAngle, rimI = D.rimI, env = D.env, exposure = 1,
                 shadow = 1, steam: st } = {}) => {
  tilt.rotation.set(lean, 0, z);
  tilt.position.y = lift;
  cup.rotation.y = rot * Math.PI * 2;
  floor.visible = shadow > 0;
  floor.material.uniforms.uA.value = shadow;
  camera.fov = fov;
  camera.aspect = innerWidth / innerHeight;
  camera.position.set(...cam);
  camera.up.set(0, 1, 0);
  if (Math.abs(cam[0] - look[0]) < 1e-3 && Math.abs(cam[2] - look[2]) < 1e-3) camera.up.set(0, 0, -1); // straight down
  camera.lookAt(...look);
  camera.updateProjectionMatrix();
  key.position.set(...keyPos); key.intensity = keyI; key.angle = keyAngle;
  rim.intensity = rimI;
  scene.environmentIntensity = env;
  renderer.toneMappingExposure = exposure;
  steam.visible = st !== undefined;
  if (steam.visible) {
    steam.material.uniforms.uTime.value = st;
    steam.quaternion.copy(camera.quaternion);
    tilt.updateMatrixWorld();
    steam.position.copy(vent.getWorldPosition(v3));
  }
  renderer.render(scene, camera);
};

// One full turn per loop, with a slow breathing tilt so it never reads as a flat product spin (cup/render.mjs).
window.frame = (t) => window.pose({ rot: t, tilt: Math.sin(t * Math.PI * 2) * 0.05, lift: Math.sin(t * Math.PI * 4) * 3 });

window.glb = () => new Promise((res, rej) => {
  const c = cup.clone();
  c.rotation.set(0, 0, 0); c.position.set(0, 0, 0);
  c.scale.setScalar(0.001);            // glTF is metres: 1 unit = 1 m
  c.children[0].material = c.children[0].material.clone();
  c.children[0].material.normalMap = null; // procedural paper grain (DataTexture): GLTFExporter can't write it
  new GLTFExporter().parse(c, (buf) => {
    let s = ''; const b = new Uint8Array(buf);
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
    res(btoa(s));
  }, rej, { binary: true });
});

if (q.has('live')) renderer.setAnimationLoop((ms) => window.pose({ rot: (ms / 8000) % 1, steam: ms / 1000 }));
else window.pose();
window.ready = true;
</script>
</body>
</html>
