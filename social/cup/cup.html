<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Blessed cup 3D</title>
<!-- 16oz Blessed cup. Units are mm, measured off IMG_0239 (0.102 mm/px, 90mm top rim).
     render.mjs drives this page: window.frame(t) poses the cup for time t (0..1 = one loop),
     window.glb() returns the model as a base64 GLB. Open directly for a live preview. -->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1a1410; }
  #bg { position: fixed; inset: -40px; background: url(boxes-backdrop.jpg) center / cover;
        filter: blur(14px) brightness(.55) saturate(.9); }
  canvas { position: fixed; inset: 0; filter: drop-shadow(0 40px 50px rgba(0,0,0,.55)); }
  body.clean #bg { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="bg"></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

const q = new URLSearchParams(location.search);
if (q.has('clean')) document.body.classList.add('clean');

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.28;

const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 100, 1400);

// key light from upper left so the highlight travels across the label as it turns
const key = new THREE.SpotLight(0xfff1e0, 7e3, 0, 0.5, 0.6, 1.2);
key.position.set(-260, 260, 380);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffe2c0, 0.6);
rim.position.set(300, 120, -300);
scene.add(rim);

const cup = new THREE.Group();
cup.name = 'BlessedCup16oz';
scene.add(cup);

// paper body: frustum, label wraps the full 360 with the logo facing +z
const H = 132.8, RT = 45, RB = 31.2;
const label = await new THREE.TextureLoader().loadAsync('cup-label.jpg');
label.colorSpace = THREE.SRGBColorSpace;
label.anisotropy = 8;
label.userData.mimeType = 'image/jpeg';
const body = new THREE.Mesh(
  new THREE.CylinderGeometry(RT, RB, H, 160, 1, true, Math.PI),
  new THREE.MeshPhysicalMaterial({ map: label, roughness: 0.8 })
);
body.name = 'Body';
body.position.y = H / 2;
cup.add(body);

const base = new THREE.Mesh(new THREE.CircleGeometry(RB, 96), new THREE.MeshStandardMaterial({ color: 0xefebe4, roughness: 0.7 }));
base.name = 'Base';
base.rotation.x = Math.PI / 2;
cup.add(base);

// top cap under the lid, so the paper tube is never see-through
const cap = new THREE.Mesh(new THREE.CircleGeometry(RT, 96), base.material);
cap.name = 'Cap';
cap.rotation.x = -Math.PI / 2;
cap.position.y = H - 0.5;
cup.add(cap);

// lid, measured off the lid photos (IMG_0306-0316): 99.6mm brim, flat ring 24.1mm above the skirt edge,
// recessed centre well, sip plateau 4.6mm proud on the spout side with a ramp, sip slot and vent pinhole.
// One mesh per angle column: a sculpted top (height field) that runs into the traced side profile,
// so the top, wall, beads and skirt are one closed surface. The skirt edge sits 1mm below the paper rim.
const rAt = (d) => RT - (RT - RB) * d / H;                 // paper radius d mm below the rim
const RE = 41.5, RING = 24.1;                                // top edge radius, flat ring height
const side = [[42.0, 22.8], [43.8, 16.6], [46.5, 15.3], [48.8, 14.5], [49.8, 11.4], [48.8, 8.3],
  [49.2, 7.4], [49.8, 3.5], [49.4, 0], [rAt(1), 0]];        // (r, h) from the top edge down to the skirt, then in to the paper
const SIP = new THREE.Vector2(-1, 0);                        // spout points left of the logo, as on the cup
const ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function top(x, z, r) {
  const s = x * SIP.x + z * SIP.y, v = -x * SIP.y + z * SIP.x;   // along / across the sip axis
  let h = -2.2 * (1 - ss(31.2, 32, r));                          // recessed centre well
  h += 4.6 * ss(5, 10, s);                                       // ramp up to the sip plateau
  h -= 0.6 * ss(40.6, RE, r);                                    // rounded top edge
  const q = Math.pow(Math.pow(Math.abs(v) / 6, 4) + Math.pow(Math.abs(s - 36.5) / 2.5, 4), 0.25);
  h -= 9 * (1 - ss(0.85, 1, q));                                 // sip slot 12 x 5mm
  const dv = Math.hypot(s + 36, v);
  h += 0.7 * Math.exp(-(dv * dv) / 5) - 5 * (1 - ss(0.7, 1.1, dv)); // vent pinhole on a small nub
  return RING + h;
}
function lidGeometry(A = 480, NR = 200) {
  const cols = [];
  for (let i = 0; i <= NR; i++) cols.push(RE * Math.pow(i / NR, 0.85));   // denser towards the rim
  const P = [], idx = [], per = NR + 1 + side.length;
  for (let a = 0; a < A; a++) {
    const th = a / A * Math.PI * 2, c = Math.cos(th), s = Math.sin(th);
    for (const r of cols) P.push(r * c, top(r * c, r * s, r), r * s);
    for (const [r, h] of side) P.push(r * c, h, r * s);
  }
  for (let a = 0; a < A; a++) {
    const o = a * per, n = ((a + 1) % A) * per;
    for (let k = 0; k < per - 1; k++) idx.push(o + k, o + k + 1, n + k, n + k, o + k + 1, n + k + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}
const lidMat = new THREE.MeshPhysicalMaterial({ color: 0x08080a, roughness: 0.4, clearcoat: 0.35, clearcoatRoughness: 0.3, side: THREE.DoubleSide });
const lid = new THREE.Mesh(lidGeometry(), lidMat);
lid.name = 'Lid';
lid.position.y = H - 1;
cup.add(lid);

camera.position.set(0, 150, 560);
camera.lookAt(0, 72, 0);

window.camera = camera;
window.frame = (t) => {
  // one full turn per loop, with a slow breathing tilt so it never reads as a flat product spin
  cup.rotation.y = t * Math.PI * 2;
  cup.rotation.z = Math.sin(t * Math.PI * 2) * 0.05;
  cup.position.y = Math.sin(t * Math.PI * 4) * 3;
  renderer.render(scene, camera);
};

window.glb = () => new Promise((res, rej) => {
  const c = cup.clone();
  c.rotation.set(0, 0, 0); c.position.set(0, 0, 0);
  c.scale.setScalar(0.001);            // glTF is metres: 1 unit = 1 m
  new GLTFExporter().parse(c, (buf) => {
    let s = ''; const b = new Uint8Array(buf);
    for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode(...b.subarray(i, i + 0x8000));
    res(btoa(s));
  }, rej, { binary: true });
});

if (q.has('live')) renderer.setAnimationLoop((ms) => window.frame((ms / 8000) % 1));
else window.frame(0);
window.ready = true;
</script>
</body>
</html>
