name: Social media publish

on:
  schedule:
    # Monday and Thursday, 08:00 UTC (~10-11am Athens time depending on DST).
    - cron: '0 8 * * 1,4'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish next queued post
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: node social/publish.mjs

      - name: Commit updated queue state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social/publish/state.json
          git diff --staged --quiet || git commit -m "Advance social publish queue"
          git push
