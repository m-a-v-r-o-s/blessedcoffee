name: Social media publish

# Feed runs every day but only posts on Mon/Thu, or on a greeting's own date
# (Christmas, Easter, ...); stories run twice a day. What goes out is decided by
# social/publish.mjs from social/publish/{queue,schedule,state}.json.

on:
  schedule:
    # Off the :00/:30 marks, where GitHub delays scheduled runs the most (6h seen).
    # Feed: 06:07 UTC (08:07-09:07 Athens depending on DST).
    - cron: '7 6 * * *'
    # Stories: 05:23 and 15:23 UTC (morning and late afternoon in Athens).
    - cron: '23 5 * * *'
    - cron: '23 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: feed or story
        type: choice
        options: [feed, story]
        default: feed

permissions:
  contents: write

# One run at a time, so two runs never race on state.json.
concurrency:
  group: social-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check schedule and media
        run: node social/publish.test.mjs

      - name: Publish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MODE: ${{ github.event.inputs.mode || (github.event.schedule == '7 6 * * *' && 'feed' || 'story') }}
          SLOT: ${{ github.event.schedule == '23 5 * * *' && 'morning' || (github.event.schedule == '23 15 * * *' && 'evening' || '') }}
        run: node social/publish.mjs "$MODE"

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add social/publish/state.json
          git diff --staged --quiet || git commit -m "Advance social publish state"
          git pull --rebase
          git push
